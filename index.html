<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>All We Are Map</title>

    <!-- Cesium CSS -->
    <link href="Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      .hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 420px;
      }
      .hud b {
        font-weight: 600;
      }
      .hud code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
      }
    </style>

    <!-- SheetJS (XLSX reader) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>

  <body>
    <div id="cesiumContainer"></div>

    <div class="hud">
      <b>Controls:</b> Click to stop tour. Keys:
      <code>R</code> orbit current site,
      <code>N</code>/<code>P</code> next/prev site,
      <code>T</code> toggle auto tour
    </div>

    <!-- Cesium JS -->
    <script src="Build/Cesium/Cesium.js"></script>

    <!-- Your app -->
    <script type="module" src="main.js"></script>
  </body>
</html>
