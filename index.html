<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cesium Map</title>

  <link rel="stylesheet" href="./Build/Cesium/Widgets/widgets.css" />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    /* ================= Sidebar ================= */

    #sidebar {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 300px;
      max-height: calc(100% - 24px);
      background: rgba(20, 20, 20, 0.86);
      color: white;
      border-radius: 12px;
      overflow: hidden;
      z-index: 40; /* make sure it stays clickable above Cesium */
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      transition: transform 0.25s ease;
      pointer-events: auto;
    }

    /* Closed state (mobile default + toggle) */
    #sidebar.sidebarClosed {
      transform: translateX(-110%);
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    #siteSearch {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: white;
      outline: none;
      box-sizing: border-box;
    }

    #siteList {
      overflow: auto;
      padding: 6px;
      -webkit-overflow-scrolling: touch;
    }

    /* ================= Controls Help ================= */

    #controlsHelp {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      width: 320px;
      max-width: calc(100% - 24px);
      background: rgba(0,0,0,0.70);
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.35;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      user-select: none;
      pointer-events: none; /* doesn't block the map */
    }

    /* Only the top "Controls" header should be block */
    #controlsHelp .helpTitle {
      font-weight: 700;
      margin-bottom: 8px;
    }

    #controlsHelp ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    /* Keep shortcut letter + sentence on ONE line */
    #controlsHelp li {
      margin: 6px 0;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    #controlsHelp li b {
      display: inline;
      min-width: 16px;
    }

    .controlsHelpHidden {
      display: none;
    }

    /* ================= Menu Toggle Button ================= */

    #menuToggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 50; /* above sidebar */
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(20,20,20,0.85);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    /* Hide the help box on mobile/touch */
    @media (max-width: 768px), (hover: none), (pointer: coarse) {
      #controlsHelp {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <!-- Toggle button -->
  <button id="menuToggle" type="button" aria-label="Toggle locations menu">☰</button>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="title">Locations</div>
      <input id="siteSearch" placeholder="Search…" />
    </div>
    <div id="siteList"></div>
  </div>

  <!-- Visible instructions (toggle with H) -->
  <div id="controlsHelp">
    <div class="helpTitle">Controls</div>
    <div>Tip: double click a site marker to zoom</div>
    <ul>
      <li><b>T</b> toggle auto tour</li>
      <li><b>R</b> rotate at current site</li>
      <li><b>N</b> next site</li>
      <li><b>P</b> previous site</li>
      <li><b>H</b> hide/show this help</li>
      <li>Click and drag the map to take control (stops tour/rotation)</li>
      <li>Mouse wheel / trackpad scroll also stops tour/rotation</li>
    </ul>
  </div>

  <script>
    window.CESIUM_BASE_URL = "./Build/Cesium/";
  </script>

  <script src="./Build/Cesium/Cesium.js"></script>
  <script src="./main.js"></script>
</body>
</html>
