<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cesium Map</title>

  <link rel="stylesheet" href="./Build/Cesium/Widgets/widgets.css" />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    /* Sidebar */
    #sidebar {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 300px;
      max-height: calc(100% - 24px);
      background: rgba(20,20,20,0.86);
      color: white;
      border-radius: 12px;
      overflow: hidden;
      z-index: 10;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    #siteSearch {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: white;
      outline: none;
    }

    #siteList {
      overflow: auto;
      padding: 6px;
    }

    /* Controls help */
    #controlsHelp {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 320px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      z-index: 20;
      pointer-events: none;
    }

    /* Mobile menu button */
    #menuToggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(20,20,20,0.85);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    /* Mobile behavior */
    @media (max-width: 768px) {
      #menuToggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #sidebar {
        transform: translateX(-110%);
        transition: transform 0.25s ease;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #controlsHelp {
        display: none;
      }
    }

    @media (hover: none), (pointer: coarse) {
      #controlsHelp {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <!-- Mobile menu button -->
  <button id="menuToggle" aria-label="Open menu">☰</button>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="title">Locations</div>
      <input id="siteSearch" placeholder="Search…" />
    </div>
    <div id="siteList"></div>
  </div>

  <!-- Controls help (desktop only) -->
  <div id="controlsHelp">
    <b>Controls</b><br />
    Double click marker to zoom<br />
    T – toggle tour<br />
    R – rotate site<br />
    N / P – next / previous<br />
    H – hide this help
  </div>

  <script>
    window.CESIUM_BASE_URL = "./Build/Cesium/";
  </script>

  <script src="./Build/Cesium/Cesium.js"></script>
  <script src="./main.js"></script>
</body>
</html>
