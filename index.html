<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cesium Map</title>

  <link rel="stylesheet" href="./Build/Cesium/Widgets/widgets.css" />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* Cesium always behind UI */
    #cesiumContainer {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ================= Sidebar ================= */
    #sidebar {
      position: absolute;
      top: 76px;
      left: 12px;
      width: 300px;
      max-height: calc(100% - 24px);
      background: rgba(20, 20, 20, 0.86);
      color: white;
      border-radius: 12px;
      overflow: hidden;

      z-index: 1000;
      pointer-events: auto;

      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      transition: transform 0.25s ease;
    }

    #sidebar * { pointer-events: auto; }

    /* Closed state controlled by JS */
    #sidebar.sidebarClosed {
      transform: translateX(-110%);
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .title {
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    #siteSearch {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: white;
      outline: none;
      box-sizing: border-box;
    }

    #siteList {
      overflow: auto;
      padding: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .siteRow {
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      margin: 4px 0;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      touch-action: manipulation;
    }

    .siteRow:hover {
      background: rgba(255,255,255,0.10);
    }

    .siteSub {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* ================= Floating controls (always visible) ================= */
     #floatingControls {
      position: absolute;
      top: 12px;
      left: 12px;          /* ✅ move to left */
      right: auto;         /* ✅ remove right anchoring */
      z-index: 1200;
    
      display: inline-flex;
      gap: 8px;
      padding: 8px;
      border-radius: 12px;
    
      background: rgba(20, 20, 20, 0.86);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    .fcBtn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 20px;
      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      pointer-events: auto;
    }

    .fcBtn:active { transform: scale(0.98); }

    /* ================= Controls Help ================= */
    #controlsHelp {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      width: 320px;
      max-width: calc(100% - 24px);
      background: rgba(0,0,0,0.70);
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.35;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      user-select: none;
      pointer-events: none;
    }

    #controlsHelp .helpTitle {
      font-weight: 700;
      margin-bottom: 8px;
    }

    #controlsHelp ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    #controlsHelp li {
      margin: 6px 0;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    #controlsHelp li b {
      display: inline;
      min-width: 16px;
    }

    .controlsHelpHidden { display: none; }

    /* Hide help on mobile */
    @media (max-width: 768px), (hover: none), (pointer: coarse) {
      #controlsHelp { display: none; }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <!-- Floating controls (always visible) -->
  <div id="floatingControls" aria-label="Map controls">
    <button id="fcMenuBtn" class="fcBtn" type="button" aria-label="Toggle locations menu">☰</button>
    <button id="fcTourBtn" class="fcBtn" type="button" aria-label="Toggle auto tour">⏸</button>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="title">Locations</div>
      <input id="siteSearch" placeholder="Search…" />
    </div>
    <div id="siteList"></div>
  </div>

  <!-- Help box -->
  <div id="controlsHelp">
    <div class="helpTitle">Controls</div>
    <div>Tip: double click a site marker to zoom</div>
    <ul>
      <li><b>T</b> toggle auto tour</li>
      <li><b>R</b> rotate at current site</li>
      <li><b>N</b> next site</li>
      <li><b>P</b> previous site</li>
      <li><b>H</b> hide/show this help</li>
      <li>Click and drag the map to take control</li>
      <li>Mouse wheel / trackpad scroll stops tour</li>
    </ul>
  </div>

  <script>
    window.CESIUM_BASE_URL = "./Build/Cesium/";
  </script>

  <script src="./Build/Cesium/Cesium.js"></script>
  <script src="./main.js"></script>
</body>
</html>
